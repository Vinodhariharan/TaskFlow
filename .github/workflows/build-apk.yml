name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      # Signing now uses android/debug.keystore, committed to the repo and
      # referenced explicitly by android/app/build.gradle.kts, so no CI-side
      # keystore setup is needed — every build, local or CI, uses the exact
      # same file, deterministically.

      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Print APK signing certificate fingerprint
        run: |
          # keytool -printcert -jarfile only understands old-style JAR
          # signing (v1) and reports "Not a signed jar file" for APKs
          # signed with the modern v2/v3 Signature Scheme, even when
          # correctly signed. apksigner (Android SDK build-tools) reads
          # all schemes and is the correct tool for this.
          SEARCH_DIRS=""
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "/usr/local/lib/android/sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then SEARCH_DIRS="$SEARCH_DIRS $d"; fi
          done
          APKSIGNER=$(find $SEARCH_DIRS -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
