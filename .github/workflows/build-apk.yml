name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      # Runners are ephemeral, so without this each run gets a brand new
      # random debug signing key, and Android refuses to install an "update"
      # signed with a different certificate than what's already on a phone.
      # Cache the debug keystore so every build shares the same signing
      # identity and can be installed over a previous build.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: taskflow-debug-keystore-v1

      - name: Create debug keystore if not cached
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Print APK signing certificate fingerprint
        run: |
          # keytool -printcert -jarfile only understands old-style JAR
          # signing (v1) and reports "Not a signed jar file" for APKs
          # signed with the modern v2/v3 Signature Scheme, even when
          # correctly signed. apksigner (Android SDK build-tools) reads
          # all schemes and is the correct tool for this.
          SEARCH_DIRS=""
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "/usr/local/lib/android/sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then SEARCH_DIRS="$SEARCH_DIRS $d"; fi
          done
          APKSIGNER=$(find $SEARCH_DIRS -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
